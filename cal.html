<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e2330">
<title>ArchPM · 마감 캘린더</title>
<link rel="manifest" href="/cal.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ArchPM 캘린더">
<style>
:root{--bg:#f4f5f7;--side:#1e2330;--pr:#3b82f6;--danger:#ef4444;--success:#10b981;--tx:#1e293b;--muted:#64748b;--bd:#e2e8f0;--w:#fff}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI','Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
#login-screen{position:fixed;inset:0;background:var(--side);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100}
.login-box{background:var(--w);border-radius:16px;padding:26px 22px;width:100%;max-width:340px}
.login-box h1{font-size:20px;font-weight:700;text-align:center;margin-bottom:2px}
.login-box .sub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:18px}
.login-box input{width:100%;padding:12px 13px;border:1px solid var(--bd);border-radius:9px;margin-bottom:9px;font-size:15px;font-family:inherit}
.login-box .go{width:100%;padding:12px;background:var(--pr);color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:600;margin-top:2px;cursor:pointer}
#login-err{font-size:12px;color:var(--danger);min-height:17px;margin-bottom:3px;text-align:center}
#app{display:none;max-width:560px;margin:0 auto;padding:12px 12px 32px}
.card{background:var(--w);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:14px;margin-bottom:10px}
.cal-head{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
.cal-head button{background:none;border:none;font-size:17px;color:var(--pr);padding:3px 12px;font-weight:700;cursor:pointer}
.cal-head .ym{font-size:15px;font-weight:700;min-width:100px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);padding:2px 0}
.cal-dow.sun{color:#ef4444}.cal-dow.sat{color:#3b82f6}
.cal-day{min-height:40px;border-radius:6px;border:1px solid var(--bd);background:#fff;padding:2px;text-align:center}
.cal-day.blank{border:none;background:transparent}
.cal-day.today{border-color:var(--pr);border-width:1.5px;background:#eff6ff}
.cal-day .dn{font-size:11.5px;font-weight:600}
.cal-day.sun .dn{color:#ef4444}.cal-day.sat .dn{color:#3b82f6}
.cal-dots{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;margin-top:1px}
.cal-dots .dot{width:5px;height:5px;border-radius:50%}
.up-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;background:#fff;border:1px solid var(--bd);margin-bottom:4px}
.up-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.up-date{font-size:11px;font-weight:700;width:42px;flex-shrink:0}
.sec-t{font-size:11.5px;font-weight:700;color:var(--muted);margin:12px 2px 6px;text-transform:uppercase;letter-spacing:.4px}
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.hdr .t{font-size:15px;font-weight:700}
.hdr .pm{font-size:11px;background:#eff6ff;color:var(--pr);padding:2px 9px;border-radius:100px;font-weight:600}
.legend{display:flex;gap:11px;justify-content:center;margin-top:7px;font-size:10.5px;color:var(--muted)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px}
.empty{text-align:center;padding:18px;color:var(--muted);font-size:12.5px}
a.full{display:block;text-align:center;font-size:12px;color:var(--pr);margin-top:6px;text-decoration:none;font-weight:600}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>⬡ ArchPM</h1>
    <div class="sub">마감 캘린더</div>
    <div id="login-err"></div>
    <input id="li-email" type="email" placeholder="이메일" autocomplete="email" onkeydown="if(event.key==='Enter')doLogin()">
    <input id="li-pw" type="password" placeholder="비밀번호" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="go" onclick="doLogin()">로그인</button>
    <button class="go" style="background:#fff;color:var(--tx);border:1px solid var(--bd);margin-top:8px" onclick="doGoogleLogin()">G 구글 계정으로 로그인</button>
    <div style="text-align:center;margin-top:10px"><a onclick="doPwReset()" style="font-size:12px;color:var(--pr);cursor:pointer;text-decoration:underline">비밀번호 재설정 메일 보내기</a></div>
  </div>
</div>

<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
// ArchPM 마감 캘린더 위젯 — 읽기 전용. index/pm과 같은 data/main 문서를 구독한다.
// URL 파라미터 ?pm=이름 을 붙이면 해당 PM 프로젝트만 표시된다 (공유용).
const FB_CONFIG = {
  apiKey: "AIzaSyCX22hL4YIhdf0AURbo5LFdqgZHLAf29k4",
  authDomain: "msarchi-757c8.firebaseapp.com",
  projectId: "msarchi-757c8",
  storageBucket: "msarchi-757c8.firebasestorage.app",
  messagingSenderId: "171658534163",
  appId: "1:171658534163:web:6fa4a05cce154ec91f8ee6",
  measurementId: "G-PPFL1JLJMT"
};
const PHASES=['기획','계획설계','기본설계','중간설계','실시설계','허가'];
const COLORS={phase:'#3b82f6',task:'#f59e0b',end:'#10b981'};
const PM_FILTER=new URLSearchParams(location.search).get('pm')||'';
let D=null, fbAuth=null, fbDb=null, _unsub=null, ym=null;

function today(){ return new Date().toISOString().split('T')[0]; }
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

firebase.initializeApp(FB_CONFIG);
fbAuth=firebase.auth(); fbDb=firebase.firestore();
fbAuth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    if(_unsub)_unsub();
    _unsub=fbDb.collection('data').doc('main').onSnapshot(snap=>{
      if(snap.exists){ D=snap.data(); render(); }
    },e=>{ document.getElementById('app').innerHTML='<div class="empty">데이터를 불러오지 못했습니다.</div>'; });
  } else {
    D=null;
    document.getElementById('login-screen').style.display='flex';
    document.getElementById('app').style.display='none';
    if(_unsub){_unsub();_unsub=null;}
  }
});
function doLogin(){
  const email=(document.getElementById('li-email').value||'').trim();
  const pw=document.getElementById('li-pw').value||'';
  if(!email||!pw){ document.getElementById('login-err').textContent='이메일과 비밀번호를 입력하세요.'; return; }
  fbAuth.signInWithEmailAndPassword(email,pw).catch(e=>{
    document.getElementById('login-err').textContent='로그인 실패: 이메일 또는 비밀번호를 확인하세요.';
  });
}
function doGoogleLogin(){
  const provider=new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithPopup(provider).catch(e=>{
    if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request') return;
    document.getElementById('login-err').textContent='구글 로그인 실패: '+(e.message||e.code);
  });
}
function doPwReset(){
  const pre=(document.getElementById('li-email').value||'').trim();
  const email=(prompt('비밀번호를 재설정할 이메일 주소를 입력하세요',pre)||'').trim();
  if(!email) return;
  const err=document.getElementById('login-err');
  fbAuth.sendPasswordResetEmail(email)
    .then(()=>{ err.style.color='#2563eb'; err.textContent=email+' 주소로 재설정 메일을 보냈습니다. 메일함(스팸함 포함)을 확인하세요.'; })
    .catch(e=>{ err.style.color=''; err.textContent='메일 발송 실패: '+(e.message||e.code); });
}

function calEvents(){
  const map={};
  const add=(date,ev)=>{ if(!date) return; (map[date]=map[date]||[]).push(ev); };
  (D.projects||[]).filter(p=>p.status==='진행중')
    .filter(p=>!PM_FILTER||(p.pm||'').trim()===PM_FILTER)
    .forEach(p=>{
      PHASES.forEach(ph=>{
        const dl=p.phaseDeadlines?.[ph];
        if(dl) add(dl,{t:'phase',pname:p.name,label:`${ph} 단계 마감`});
        (D.phaseTasks?.[p.id]?.[ph]||[]).forEach(tk=>{
          if(tk.dueDate&&!tk.done) add(tk.dueDate,{t:'task',pname:p.name,label:tk.text});
          (tk.subTasks||[]).forEach(s=>{ if(s.dueDate&&!s.done) add(s.dueDate,{t:'task',pname:p.name,label:s.text}); });
        });
      });
      if(p.end) add(p.end,{t:'end',pname:p.name,label:'준공 목표'});
    });
  return map;
}
function shift(n){
  const [y,m]=(ym||today().slice(0,7)).split('-').map(Number);
  const d=new Date(y,m-1+n,1);
  ym=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  render();
}
function render(){
  if(!D) return;
  const t=today();
  if(!ym) ym=t.slice(0,7);
  const [y,m]=ym.split('-').map(Number);
  const events=calEvents();
  const startDow=new Date(y,m-1,1).getDay();
  const daysIn=new Date(y,m,0).getDate();

  const dows=['일','월','화','수','목','금','토'].map((d,i)=>
    `<div class="cal-dow ${i===0?'sun':i===6?'sat':''}">${d}</div>`).join('');
  let cells='';
  for(let i=0;i<startDow;i++) cells+='<div class="cal-day blank"></div>';
  for(let d=1;d<=daysIn;d++){
    const ds=`${ym}-${String(d).padStart(2,'0')}`;
    const evs=events[ds]||[];
    const dow=(startDow+d-1)%7;
    const types=[...new Set(evs.map(e=>e.t))];
    const dots=types.slice(0,3).map(tp=>`<span class="dot" style="background:${COLORS[tp]}"></span>`).join('');
    cells+=`<div class="cal-day ${ds===t?'today':''} ${dow===0?'sun':dow===6?'sat':''}">
      <div class="dn">${d}</div><div class="cal-dots">${dots}</div></div>`;
  }

  // 다가오는 마감 14일
  const upEnd=new Date(new Date(t).getTime()+14*864e5).toISOString().split('T')[0];
  const upcoming=Object.keys(events).filter(ds=>ds>=t&&ds<=upEnd).sort()
    .flatMap(ds=>events[ds].map(e=>({...e,ds})));
  const overdue=Object.keys(events).filter(ds=>ds<t).sort()
    .flatMap(ds=>events[ds].filter(e=>e.t==='task'||e.t==='phase').map(e=>({...e,ds})));

  const item=e=>`
<div class="up-item">
  <span class="up-date" style="color:${e.ds<t?'#b91c1c':e.ds===t?'#1d4ed8':'var(--muted)'}">${Number(e.ds.slice(5,7))}/${Number(e.ds.slice(8))}</span>
  <span class="dot" style="background:${COLORS[e.t]}"></span>
  <div style="flex:1;min-width:0">
    <div style="font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.label)}</div>
    <div style="font-size:10.5px;color:var(--muted)">${esc(e.pname)}</div>
  </div>
</div>`;

  document.getElementById('app').innerHTML=`
<div class="card">
  <div class="hdr">
    <span class="t">⬡ ArchPM 마감 캘린더</span>
    ${PM_FILTER?`<span class="pm">PM · ${esc(PM_FILTER)}</span>`:''}
    <span style="flex:1"></span>
    <button onclick="fbAuth.signOut()" style="background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer">로그아웃</button>
  </div>
  <div class="cal-head">
    <button onclick="shift(-1)">‹</button>
    <span class="ym">${y}년 ${m}월</span>
    <button onclick="shift(1)">›</button>
  </div>
  <div class="cal-grid">${dows}${cells}</div>
  <div class="legend">
    <span><i style="background:${COLORS.phase}"></i>단계 마감</span>
    <span><i style="background:${COLORS.task}"></i>업무 마감</span>
    <span><i style="background:${COLORS.end}"></i>준공 목표</span>
  </div>
</div>
${overdue.length?`<div class="sec-t" style="color:#b91c1c">기한 초과 (${overdue.length})</div>${overdue.map(item).join('')}`:''}
<div class="sec-t">다가오는 마감 · 14일 (${upcoming.length})</div>
${upcoming.length?upcoming.map(item).join(''):'<div class="empty">2주 내 마감 일정이 없습니다.</div>'}
<a class="full" href="/pm.html">PM 업무등록 앱 열기 ›</a>`;
}
</script>
</body>
</html>
