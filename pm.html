<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e2330">
<title>ArchPM · PM 업무등록</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArchPM">
<style>
:root{--bg:#f4f5f7;--side:#1e2330;--pr:#3b82f6;--prd:#2563eb;--danger:#ef4444;--success:#10b981;--warn:#f59e0b;--tx:#1e293b;--muted:#64748b;--bd:#e2e8f0;--w:#fff;--r:10px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Segoe UI','Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
#app{display:none;flex-direction:column;min-height:100%}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:15px;color:var(--tx)}
input:focus,select:focus{outline:none;border-color:var(--pr)!important;box-shadow:0 0 0 3px rgba(59,130,246,.12)}

/* ── 로그인 ── */
#login-screen{position:fixed;inset:0;background:var(--side);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100}
.login-box{background:var(--w);border-radius:16px;padding:28px 24px;width:100%;max-width:360px}
.login-box h1{font-size:22px;font-weight:700;text-align:center;margin-bottom:4px}
.login-box .sub{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:22px}
.login-box input{width:100%;padding:13px 14px;border:1px solid var(--bd);border-radius:9px;margin-bottom:10px;font-size:15px}
.login-box .go{width:100%;padding:13px;background:var(--pr);color:#fff;border:none;border-radius:9px;font-size:15.5px;font-weight:600;margin-top:4px}
#login-err{font-size:12.5px;color:var(--danger);min-height:18px;margin-bottom:4px;text-align:center}
.login-note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6}

/* ── 헤더 ── */
#hdr{background:var(--side);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
#hdr .logo{font-size:16px;font-weight:700;letter-spacing:-.3px}
#hdr .pm-badge{font-size:11px;background:rgba(255,255,255,.12);padding:3px 9px;border-radius:100px;color:rgba(255,255,255,.85)}
#hdr .sp{flex:1}
#hdr button{background:none;border:none;color:rgba(255,255,255,.65);font-size:12px;padding:5px 8px}

/* ── 공통 ── */
#content{flex:1;padding:14px 14px 40px;max-width:640px;width:100%;margin:0 auto}
.card{background:var(--w);border-radius:var(--r);box-shadow:0 1px 3px rgba(0,0,0,.08);padding:15px;margin-bottom:11px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600;white-space:nowrap}
.b-bl{background:#dbeafe;color:#1d4ed8}.b-gr{background:#d1fae5;color:#065f46}
.b-ye{background:#fef3c7;color:#92400e}.b-re{background:#fee2e2;color:#991b1b}.b-gy{background:#f1f5f9;color:#475569}
.empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:13.5px}

/* ── 프로젝트 목록 ── */
.proj-card{display:block;width:100%;text-align:left;border:none;background:var(--w);border-radius:var(--r);box-shadow:0 1px 3px rgba(0,0,0,.08);padding:15px;margin-bottom:10px;border-left:4px solid var(--pr)}
.proj-card:active{background:#f8fafc}
.proj-card.p-done{border-left-color:var(--success);opacity:.7}
.proj-name{font-size:15.5px;font-weight:700;margin-bottom:5px}
.proj-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.sec-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:16px 2px 8px}

/* ── 단계 섹션 (드롭다운 아코디언) ── */
.ph-sec{background:var(--w);border-radius:var(--r);box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:9px;overflow:hidden;border:1.5px solid transparent}
.ph-sec:has(.ph-head.open){border-color:var(--pr)}
.ph-head{display:block;padding:11px 15px 12px;border:none;background:none;width:100%;text-align:left}
.ph-due{font-size:11.5px;font-weight:600;margin-bottom:5px}
.ph-head-row{display:flex;align-items:center;gap:9px}
.due-edit{display:flex;align-items:center;gap:9px;padding:9px 11px;background:#f8fafc;border:1px solid var(--bd);border-radius:8px;margin-bottom:11px}
.due-edit label{font-size:12.5px;font-weight:700;color:var(--tx);white-space:nowrap}
.due-edit input[type=date]{flex:1;padding:7px 10px;border:1px solid var(--bd);border-radius:7px;font-size:13.5px;background:#fff;min-width:120px}
.ph-head .arrow{font-size:11px;color:var(--muted);transition:transform .15s}
.ph-head.open .arrow{transform:rotate(90deg)}
.ph-body{padding:0 15px 15px;border-top:1px solid var(--bd);padding-top:12px}
.ph-stat{font-size:12px;color:var(--muted)}

/* ── 업무 ── */
.task{border:1px solid var(--bd);border-radius:9px;margin-bottom:7px;background:#fff}
.task.done{background:var(--bg)}
.task-row{display:flex;align-items:flex-start;gap:10px;padding:11px 12px}
.task-row input[type=checkbox]{width:19px;height:19px;accent-color:var(--pr);flex-shrink:0;margin-top:1px}
.task-text{flex:1;font-size:14px;line-height:1.5;word-break:keep-all}
.task.done .task-text{text-decoration:line-through;color:var(--muted)}
.task-del{background:none;border:none;color:#cbd5e1;font-size:15px;padding:0 2px;line-height:1}
.subs{padding:0 12px 10px 40px}
.sub-row{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;background:#f8fafc;margin-bottom:4px;border:1px solid #e5e7eb}
.sub-row.done{background:#f0fdf4;border-color:#bbf7d0}
.sub-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--pr);flex-shrink:0}
.sub-text{flex:1;font-size:12.5px}
.sub-row.done .sub-text{text-decoration:line-through;color:var(--muted)}
.sub-add-btn{font-size:12px;color:var(--pr);background:none;border:none;padding:2px 0;opacity:.8}

/* ── 입력 폼 ── */
.add-form{margin-top:10px;padding:12px;background:#f8fafc;border-radius:9px;border:1px dashed #cbd5e1}
.add-form input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:8px;margin-bottom:9px;font-size:14.5px}
.due-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.due-label{font-size:12.5px;font-weight:700;color:var(--tx)}
.due-label .req{color:var(--danger)}
.due-row input[type=date]{padding:8px 10px;border:1px solid var(--bd);border-radius:8px;font-size:13.5px;background:#fff;flex:1;min-width:130px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--bd);background:#fff;border-radius:100px;padding:5px 12px;font-size:12px;color:var(--muted);font-weight:600}
.chip.on{border-color:var(--pr);background:#eff6ff;color:var(--pr)}
.form-btns{display:flex;gap:7px}
.form-btns .add{flex:1;padding:11px;background:var(--pr);color:#fff;border:none;border-radius:8px;font-size:14.5px;font-weight:600}
.form-btns .cancel{padding:11px 16px;background:#fff;color:var(--muted);border:1px solid var(--bd);border-radius:8px;font-size:13.5px}
.open-add{width:100%;padding:10px;background:transparent;border:1.5px dashed var(--pr);color:var(--pr);border-radius:9px;font-size:13.5px;font-weight:600;margin-top:9px;opacity:.85}

/* ── 토스트 ── */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(30,35,48,.94);color:#fff;padding:10px 20px;border-radius:100px;font-size:13px;transition:transform .25s;z-index:200;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0)}

.back-btn{background:none;border:none;color:var(--pr);font-size:14px;font-weight:600;padding:2px 0;margin-bottom:10px;display:inline-flex;align-items:center;gap:4px}
select.pm-sel{padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:#fff;width:100%}

/* ── 캘린더 ── */
.cal-head{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
.cal-head button{background:none;border:none;font-size:18px;color:var(--pr);padding:4px 12px;font-weight:700}
.cal-head .ym{font-size:16px;font-weight:700;min-width:110px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:3px 0}
.cal-dow.sun{color:#ef4444}.cal-dow.sat{color:#3b82f6}
.cal-day{min-height:46px;border-radius:7px;border:1px solid var(--bd);background:#fff;padding:3px 2px 2px;text-align:center;cursor:pointer}
.cal-day.blank{border:none;background:transparent;cursor:default}
.cal-day.today{border-color:var(--pr);border-width:1.5px}
.cal-day.sel{background:#eff6ff;border-color:var(--pr)}
.cal-day .dn{font-size:12px;font-weight:600}
.cal-day.sun .dn{color:#ef4444}.cal-day.sat .dn{color:#3b82f6}
.cal-dots{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;margin-top:2px}
.cal-dots .dot{width:6px;height:6px;border-radius:50%}
.cal-ev{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid var(--bd);margin-bottom:5px}
.cal-ev .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cal-legend{display:flex;gap:12px;justify-content:center;margin:8px 0 2px;font-size:11px;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:4px}
.cal-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ── 단계별 마감일 메뉴 ── */
.dl-row{display:flex;align-items:center;gap:9px;padding:10px 2px;border-bottom:1px solid var(--bd)}
.dl-row:last-of-type{border-bottom:none}
.dl-row.cur{background:#eff6ff;border-radius:8px;padding:10px 8px;margin:0 -6px;border-bottom:none}
.dl-info{width:92px;flex-shrink:0}
.dl-row input[type=date]{flex:1;padding:8px 9px;border:1px solid var(--bd);border-radius:7px;font-size:13px;background:#fff;min-width:110px}

/* ── 새 프로젝트 폼 ── */
.np-field{margin-bottom:12px}
.np-field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.np-field .req{color:var(--danger)}
.np-field input,.np-field select{width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:8px;font-size:14.5px;background:#fff}
.np-row{display:flex;gap:9px}
.np-row .np-field{flex:1}
.np-note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.6}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login-screen">
  <div class="login-box">
    <h1>⬡ ArchPM</h1>
    <div class="sub">PM 업무등록 · 모바일</div>
    <div id="login-err"></div>
    <input id="li-email" type="email" placeholder="이메일" autocomplete="email" onkeydown="if(event.key==='Enter')doLogin()">
    <input id="li-pw" type="password" placeholder="비밀번호" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="go" onclick="doLogin()">로그인</button>
    <div class="login-note">계정이 없거나 승인이 필요하면<br>데스크톱 ArchPM에서 회원가입 후 관리자 승인을 받으세요.</div>
  </div>
</div>

<!-- 앱 -->
<div id="app">
  <div id="hdr">
    <span class="logo">⬡ ArchPM</span>
    <span class="pm-badge" id="hdr-pm"></span>
    <span class="sp"></span>
    <button onclick="doLogout()">로그아웃</button>
  </div>
  <div id="content"></div>
</div>

<div id="toast">✓ 저장됨 — 웹에 반영되었습니다</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
// ============================================================
// ArchPM PM 모드 — index.html과 동일한 Firestore 문서(data/main)를
// 공유한다. 여기서 저장하면 데스크톱 웹앱에 실시간 반영된다.
// ============================================================
const FB_CONFIG = {
  apiKey: "AIzaSyCX22hL4YIhdf0AURbo5LFdqgZHLAf29k4",
  authDomain: "msarchi-757c8.firebaseapp.com",
  projectId: "msarchi-757c8",
  storageBucket: "msarchi-757c8.firebasestorage.app",
  messagingSenderId: "171658534163",
  appId: "1:171658534163:web:6fa4a05cce154ec91f8ee6",
  measurementId: "G-PPFL1JLJMT"
};
const PHASES = ['기획','계획설계','기본설계','중간설계','실시설계','허가'];
const DEFAULT_PHASE_RATIOS = {'기획':5,'계획설계':15,'기본설계':20,'중간설계':30,'실시설계':25,'허가':5};
const PM_KEY = 'archpm_pm_name';

let D = null;            // 로드 전에는 null — 저장 금지 (빈 데이터로 덮어쓰기 방지)
let fbAuth=null, fbDb=null, _unsub=null, _saving=false, _userDoc=null;
// V: 화면 상태
let V = { screen:'home', pid:null, openPhase:null, showAll:false, addOpen:null, subOpen:null, calYm:null, calSel:null, calMine:true, gcalOpen:false };

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function today(){ return new Date().toISOString().split('T')[0]; }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().split('T')[0]; }
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fdate(s){ if(!s)return '-'; const d=new Date(s); return `${d.getMonth()+1}/${d.getDate()}`; }

// ── 인증 ─────────────────────────────────────────────────
function initFirebase(){
  firebase.initializeApp(FB_CONFIG);
  fbAuth=firebase.auth(); fbDb=firebase.firestore();
  fbAuth.onAuthStateChanged(user=>{
    if(user){ checkApproval(user); }
    else{
      _userDoc=null; D=null;
      document.getElementById('login-screen').style.display='flex';
      document.getElementById('app').style.display='none';
      if(_unsub){_unsub();_unsub=null;}
    }
  });
}
function checkApproval(user){
  fbDb.collection('users').doc(user.uid).get().then(doc=>{
    if(doc.exists && doc.data().status==='approved'){ _userDoc=doc.data(); enterApp(); }
    else{
      showErr(doc.exists?'승인 대기 중입니다. 관리자에게 문의하세요.':'데스크톱 ArchPM에서 먼저 회원가입하세요.');
      fbAuth.signOut();
    }
  }).catch(()=>{ _userDoc={name:user.email.split('@')[0]}; enterApp(); });
}
function doLogin(){
  const email=(document.getElementById('li-email').value||'').trim();
  const pw=document.getElementById('li-pw').value||'';
  if(!email||!pw){ showErr('이메일과 비밀번호를 입력하세요.'); return; }
  showErr('');
  fbAuth.signInWithEmailAndPassword(email,pw).catch(e=>{
    const m={'auth/user-not-found':'등록되지 않은 이메일입니다.','auth/wrong-password':'비밀번호가 틀렸습니다.','auth/invalid-email':'이메일 형식이 올바르지 않습니다.','auth/too-many-requests':'시도가 너무 많습니다. 잠시 후 다시.','auth/invalid-credential':'이메일 또는 비밀번호가 올바르지 않습니다.'};
    showErr(m[e.code]||'로그인 실패: '+e.message);
  });
}
function doLogout(){ if(fbAuth) fbAuth.signOut(); }
function showErr(m){ document.getElementById('login-err').textContent=m; }

// ── 데이터 로드/저장 ─────────────────────────────────────
function enterApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('content').innerHTML='<div class="empty">불러오는 중...</div>';
  fbDb.collection('data').doc('main').get().then(doc=>{
    if(doc.exists){ D=doc.data(); if(!D.phaseTasks) D.phaseTasks={}; history.replaceState({screen:V.screen,pid:V.pid},''); render(); setupSync(); }
    else{ document.getElementById('content').innerHTML='<div class="empty">데이터가 없습니다.<br>데스크톱 ArchPM에서 먼저 프로젝트를 등록하세요.</div>'; }
  }).catch(e=>{
    document.getElementById('content').innerHTML='<div class="empty">데이터를 불러오지 못했습니다.<br>'+esc(e.message)+'</div>';
  });
}
function setupSync(){
  if(_unsub)_unsub();
  _unsub=fbDb.collection('data').doc('main').onSnapshot(snap=>{
    if(!snap.exists||_saving) return;
    if(snap.metadata.hasPendingWrites) return;
    D=snap.data(); if(!D.phaseTasks) D.phaseTasks={};
    render();
  },e=>console.warn('sync error:',e));
}
function save(){
  if(!D){ alert('데이터가 아직 로드되지 않았습니다.'); return; }
  _saving=true;
  fbDb.collection('data').doc('main').set(D)
    .then(()=>{ _saving=false; toast(); })
    .catch(e=>{ _saving=false; alert('저장 실패: '+e.message); });
}
function toast(){
  const t=document.getElementById('toast');
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800);
}

// ── PM 매칭 ──────────────────────────────────────────────
function pmNames(){
  const s=new Set();
  (D.projects||[]).forEach(p=>{ if(p.pm&&p.pm.trim()) s.add(p.pm.trim()); });
  return [...s].sort();
}
function myPm(){
  const saved=localStorage.getItem(PM_KEY);
  if(saved) return saved;
  const names=pmNames();
  const uname=(_userDoc?.name||'').trim();
  if(uname&&names.includes(uname)) return uname;
  return '';
}
function setPm(name){
  if(name) localStorage.setItem(PM_KEY,name); else localStorage.removeItem(PM_KEY);
  render();
}

// ── 렌더 ─────────────────────────────────────────────────
// 화면 전환: go()는 히스토리에 쌓고, 안드로이드 뒤로가기(popstate)는 쌓지 않고 복원만
function applyNav(screen,pid){ V={...V,screen,pid:pid||null,openPhase:null,addOpen:null,subOpen:null}; render(); window.scrollTo(0,0); }
function go(screen,pid){ history.pushState({screen,pid:pid||null},''); applyNav(screen,pid); }
window.addEventListener('popstate',e=>{
  if(!D) return;                       // 로그인 전에는 무시
  const s=e.state||{screen:'home',pid:null};
  applyNav(s.screen,s.pid);
});
function render(){
  if(!D) return;
  document.getElementById('hdr-pm').textContent=myPm()?('PM · '+myPm()):'PM 미선택';
  const c=document.getElementById('content');
  c.innerHTML = V.screen==='proj'&&V.pid ? renderProj(V.pid)
    : V.screen==='deadlines'&&V.pid ? renderDeadlines(V.pid)
    : (V.screen==='new'||V.screen==='edit') ? renderProjForm()
    : V.screen==='cal' ? renderCal()
    : renderHome();
}

function taskCount(pid){
  let total=0,done=0,soon=null;
  const t=today();
  PHASES.forEach(ph=>(D.phaseTasks?.[pid]?.[ph]||[]).forEach(tk=>{
    total++; if(tk.done) done++;
    const dues=[tk.dueDate,...(tk.subTasks||[]).filter(s=>!s.done).map(s=>s.dueDate)].filter(Boolean);
    dues.forEach(d=>{ if(!tk.done&&(soon===null||d<soon)) soon=d; });
  }));
  return {total,done,soon};
}

function renderHome(){
  const pm=myPm();
  const names=pmNames();
  const pmSel=`
<div class="card">
  <div style="font-size:12.5px;font-weight:700;margin-bottom:7px">담당 PM 선택</div>
  <select class="pm-sel" onchange="setPm(this.value)">

// ── 업무등록 박스의 단계 마감일 수정: 변경 폭(delta)만큼 뒤 단계 마감일도
// 같이 이동한다. 해당 단계 비율은 현황과 동일한 계산식으로 재계산되고,
// 뒤 단계들은 기간이 그대로 유지되므로 비율도 변하지 않는다. ──
function setPhaseDeadlineCascade(pid,idx,newDate){
  const p=(D.projects||[]).find(x=>x.id===pid); if(!p) return;
  if(!p.phaseDeadlines) p.phaseDeadlines={};
  if(!p.phaseRatios) p.phaseRatios={};
  const ph=PHASES[idx];
  const oldDate=p.phaseDeadlines[ph]||'';
  const isLast=idx===PHASES.length-1;
  // 삭제·마지막 단계·기존 마감일 없음(이동 기준 없음) → 현황 방식 그대로
  if(!newDate||isLast||!oldDate){ setPhaseDeadline(pid,idx,newDate); return; }
  const delta=Math.round((new Date(newDate)-new Date(oldDate))/864e5);
  p.phaseDeadlines[ph]=newDate;
  const cVal=p.contract||'', eVal=p.end||'';
  if(cVal&&eVal){
    const totalDays=(new Date(eVal)-new Date(cVal))/86400000;
    if(totalDays>0){
      const prevDl=idx>0?(p.phaseDeadlines[PHASES[idx-1]]||cVal):cVal;
      p.phaseRatios[ph]=Math.round((new Date(newDate)-new Date(prevDl))/86400000/totalDays*100);
    }
  }
  if(delta!==0){
    for(let j=idx+1;j<PHASES.length;j++){
      const jph=PHASES[j];
      if(p.phaseDeadlines[jph]){
        p.phaseDeadlines[jph]=new Date(new Date(p.phaseDeadlines[jph]).getTime()+delta*864e5).toISOString().split('T')[0];
      }
    }
  }
  save(); render();
}

// ── 단계 마감일 수정 (데스크톱 프로젝트 현황 onDeadlineChange와 동일 로직) ──
// 마감일 변경 시 해당 단계 비율을 재계산하고, 다음 단계(마지막이면 이전 단계)
// 비율을 역산해 합계 100%를 유지한다.
function setPhaseDeadline(pid,idx,newDate){
  const p=(D.projects||[]).find(x=>x.id===pid); if(!p) return;
  const cVal=p.contract||'', eVal=p.end||'';
  if(!p.phaseDeadlines) p.phaseDeadlines={};
  if(!p.phaseRatios) p.phaseRatios={};
  const ph=PHASES[idx];
  if(!newDate){ delete p.phaseDeadlines[ph]; save(); render(); return; }
  p.phaseDeadlines[ph]=newDate;
  const start=cVal?new Date(cVal):null;
  const totalDays=(cVal&&eVal)?(new Date(eVal)-start)/86400000:0;
  if(totalDays>0){
    const prevDl=idx>0?(p.phaseDeadlines[PHASES[idx-1]]||cVal):cVal;
    const newRatio=Math.round((new Date(newDate)-new Date(prevDl))/86400000/totalDays*100);
    p.phaseRatios[ph]=newRatio;
    const isLast=idx===PHASES.length-1;
    const adjIdx=isLast?idx-1:idx+1;
    if(adjIdx>=0&&adjIdx<PHASES.length){
      const adjPh=PHASES[adjIdx];
      if(isLast||p.phaseDeadlines[adjPh]){
        const sumOthers=PHASES.reduce((s,phase,j)=>{
          if(j===idx||j===adjIdx) return s;
          return s+(p.phaseRatios[phase]!==undefined?p.phaseRatios[phase]:(DEFAULT_PHASE_RATIOS[phase]||0));
        },0);
        p.phaseRatios[adjPh]=Math.max(0,Math.round(100-sumOthers-newRatio));
      }
    }
  }
  save(); render();
}

const CAL_COLORS={phase:'#3b82f6',task:'#f59e0b',end:'#10b981',gcal:'#8b5cf6'};

// ── 구글 캘린더(iCal) 연동: D.gcalCals=[{name,url}] — /api/gcal 프록시로 로드 ──
let GCAL={key:'',events:null,loading:false};
function parseIcs(text){
  const events=[];
  const lines=String(text||'').replace(/\r/g,'').replace(/\n[ \t]/g,'').split('\n');
  let cur=null;
  for(const line of lines){
    if(line==='BEGIN:VEVENT'){ cur={}; continue; }
    if(line==='END:VEVENT'){ if(cur&&cur.date&&cur.summary) events.push(cur); cur=null; continue; }
    if(!cur) continue;
    if(line.startsWith('DTSTART')){
      const v=line.slice(line.lastIndexOf(':')+1).trim();
      let d=null;
      if(/^\d{8}$/.test(v)) d=`${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`;
      else if(/^\d{8}T\d{6}Z$/.test(v)){
        const dt=new Date(Date.UTC(+v.slice(0,4),+v.slice(4,6)-1,+v.slice(6,8),+v.slice(9,11),+v.slice(11,13),+v.slice(13,15)));
        d=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      }
      else if(/^\d{8}T\d{6}$/.test(v)) d=`${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`;
      cur.date=d;
    }
    else if(line.startsWith('SUMMARY')) cur.summary=line.slice(line.indexOf(':')+1).replace(/\\,/g,',').replace(/\\n/g,' ').trim();
  }
  return events;
}
function loadGcal(){
  const cals=D.gcalCals||[];
  const key=JSON.stringify(cals.map(c=>c.url));
  if(!cals.length){ GCAL={key,events:[],loading:false}; return; }
  if(GCAL.key===key&&(GCAL.events||GCAL.loading)) return;
  GCAL={key,events:null,loading:true};
  Promise.all(cals.map(c=>
    fetch('/api/gcal?url='+encodeURIComponent(c.url)).then(r=>r.ok?r.text():'').catch(()=>'')
  )).then(texts=>{
    const evs=[];
    texts.forEach((tx,i)=>parseIcs(tx).forEach(e=>evs.push({date:e.date,label:e.summary,cal:cals[i].name||'구글 캘린더'})));
    GCAL={key,events:evs,loading:false};
    if(V.screen==='cal') render();
  });
}
function addGcal(){
  const name=(document.getElementById('gc-name')?.value||'').trim();
  const url=(document.getElementById('gc-url')?.value||'').trim();
  if(!/^https:\/\/calendar\.google\.com\//.test(url)){ alert('구글캘린더의 iCal 비공개 주소(https://calendar.google.com/...)를 붙여넣으세요.'); return; }
  if(!D.gcalCals) D.gcalCals=[];
  D.gcalCals.push({name:name||'구글 캘린더',url});
  save(); render();
}
function delGcal(i){
  if(!confirm('이 구글 캘린더 연동을 삭제할까요?')) return;
  D.gcalCals.splice(i,1);
  save(); render();
}
// 날짜 → 이벤트 목록: 단계 마감일 / 업무·하위업무 마감일 / 준공 목표
function calEvents(mineOnly){
  const map={};
  const add=(date,ev)=>{ if(!date) return; (map[date]=map[date]||[]).push(ev); };
  const pm=myPm();
  (D.projects||[]).filter(p=>p.status==='진행중')
    .filter(p=>!mineOnly||!pm||(p.pm||'').trim()===pm)
    .forEach(p=>{
      PHASES.forEach(ph=>{
        const dl=p.phaseDeadlines?.[ph];
        if(dl) add(dl,{t:'phase',pid:p.id,pname:p.name,label:`${ph} 단계 마감`});
        (D.phaseTasks?.[p.id]?.[ph]||[]).forEach(tk=>{
          if(tk.dueDate) add(tk.dueDate,{t:'task',pid:p.id,pname:p.name,label:tk.text,done:tk.done});
          (tk.subTasks||[]).forEach(s=>{ if(s.dueDate) add(s.dueDate,{t:'task',pid:p.id,pname:p.name,label:s.text,done:s.done}); });
        });
      });
      if(p.end) add(p.end,{t:'end',pid:p.id,pname:p.name,label:'준공 목표'});
    });
  return map;
}
function calShift(n){
  const [y,m]=(V.calYm||today().slice(0,7)).split('-').map(Number);
  const d=new Date(y,m-1+n,1);
  V.calYm=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  V.calSel=null; render();
}
function renderCal(){
  const t=today();
  const ym=V.calYm||t.slice(0,7); V.calYm=ym;
  const [y,m]=ym.split('-').map(Number);
  const events=calEvents(V.calMine);
  // 구글 캘린더 일정 병합
  loadGcal();
  (GCAL.events||[]).forEach(e=>{
    if(!e.date) return;
    (events[e.date]=events[e.date]||[]).push({t:'gcal',pid:null,pname:e.cal,label:e.label});
  });
  const startDow=new Date(y,m-1,1).getDay();
  const daysIn=new Date(y,m,0).getDate();
  const sel=V.calSel||(t.slice(0,7)===ym?t:null);

  const dows=['일','월','화','수','목','금','토'].map((d,i)=>
    `<div class="cal-dow ${i===0?'sun':i===6?'sat':''}">${d}</div>`).join('');
  let cells='';
  for(let i=0;i<startDow;i++) cells+='<div class="cal-day blank"></div>';
  for(let d=1;d<=daysIn;d++){
    const ds=`${ym}-${String(d).padStart(2,'0')}`;
    const evs=events[ds]||[];
    const dow=(startDow+d-1)%7;
    // 점 표시: 완료된 업무는 제외, 유형별 1개씩 최대 3개
    const types=[...new Set(evs.filter(e=>!(e.t==='task'&&e.done)).map(e=>e.t))];
    const dots=types.slice(0,4).map(tp=>`<span class="dot" style="background:${CAL_COLORS[tp]}"></span>`).join('');
    cells+=`<div class="cal-day ${ds===t?'today':''} ${ds===sel?'sel':''} ${dow===0?'sun':dow===6?'sat':''}"
      onclick="V.calSel='${ds}';render()">
      <div class="dn">${d}</div><div class="cal-dots">${dots}</div></div>`;
  }

  const selEvs=sel?(events[sel]||[]):[];
  const selList=sel?`
<div class="sec-title">${Number(sel.slice(5,7))}월 ${Number(sel.slice(8))}일 마감 (${selEvs.length})</div>
${selEvs.length?selEvs.map(e=>`
<div class="cal-ev" ${e.pid?`onclick="go('proj','${e.pid}')"`:''}>
  <span class="dot" style="background:${CAL_COLORS[e.t]}"></span>
  <div style="flex:1;min-width:0">
    <div style="font-size:13.5px;${e.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(e.label)}</div>
    <div style="font-size:11px;color:var(--muted)">${esc(e.pname)}</div>
  </div>
  ${e.done?'<span style="font-size:11px;color:var(--success);font-weight:600">✓</span>':''}
</div>`).join(''):'<div class="empty" style="padding:16px">마감 일정이 없습니다.</div>'}`:'';

  return `
<button class="back-btn" onclick="go('home')">‹ 내 프로젝트</button>
<div class="card">
  <div class="cal-head">
    <button onclick="calShift(-1)">‹</button>
    <span class="ym">${y}년 ${m}월</span>
    <button onclick="calShift(1)">›</button>
  </div>
  <div style="text-align:center;margin-bottom:8px">
    <button class="chip ${V.calMine?'on':''}" onclick="V.calMine=!V.calMine;render()">${V.calMine?'내 프로젝트만 ✓':'전체 프로젝트'}</button>
  </div>
  <div class="cal-grid">${dows}${cells}</div>
  <div class="cal-legend">
    <span><i style="background:${CAL_COLORS.phase}"></i>단계 마감</span>
    <span><i style="background:${CAL_COLORS.task}"></i>업무 마감</span>
    <span><i style="background:${CAL_COLORS.end}"></i>준공 목표</span>
    <span><i style="background:${CAL_COLORS.gcal}"></i>구글 일정</span>
  </div>
  ${GCAL.loading?'<div style="text-align:center;font-size:11px;color:var(--muted);margin-top:5px">구글 캘린더 불러오는 중...</div>':''}
</div>
${renderGcalConfig()}
${selList}`;
}
function renderGcalConfig(){
  const cals=D.gcalCals||[];
  return `
<div class="card" style="padding:12px 14px">
  <button class="sub-add-btn" style="font-size:13px" onclick="V.gcalOpen=!V.gcalOpen;render()">⚙ 구글 캘린더 연동 ${cals.length?`(${cals.length}개 연결됨)`:''}</button>
  ${V.gcalOpen?`
  <div style="margin-top:10px">
    ${cals.map((c,i)=>`
    <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:#f8fafc;border:1px solid var(--bd);border-radius:7px;margin-bottom:5px">
      <span class="dot" style="width:8px;height:8px;border-radius:50%;background:${CAL_COLORS.gcal};flex-shrink:0"></span>
      <span style="flex:1;font-size:13px">${esc(c.name)}</span>
      <button class="task-del" onclick="delGcal(${i})">✕</button>
    </div>`).join('')}
    <input type="text" id="gc-name" placeholder="이름 (예: 내 구글 캘린더)" style="width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;font-size:13.5px">
    <input type="text" id="gc-url" placeholder="iCal 비공개 주소 붙여넣기 (https://calendar.google.com/...)" style="width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;margin-bottom:7px;font-size:12.5px">
    <button class="open-add" style="margin:0" onclick="addGcal()">＋ 연동 추가</button>
    <div class="np-note" style="text-align:left;margin-top:9px">📌 주소 찾는 법: 구글캘린더(웹) → ⚙ 설정 → 왼쪽에서 내 캘린더 선택 → <b>캘린더 통합</b> → <b>iCal 형식의 비공개 주소</b> 복사.<br>구글캘린더에 일정을 입력하면 여기 캘린더에 보라색으로 자동 표시됩니다 (최대 5분 지연). 반복 일정은 첫 회차만 표시됩니다.</div>
  </div>`:''}
</div>`;
}

  const isEdit=V.screen==='edit';
  const p=isEdit?((D.projects||[]).find(x=>x.id===V.pid)||{}):{};
  const types=['업무시설','근린생활시설','단독주택','공동주택','교육시설','의료시설','기타'];
  const statuses=['진행중','보류','완료','대기'];
  const backClick=isEdit?`go('proj','${V.pid}')`:`go('home')`;
  return `
<button class="back-btn" onclick="${backClick}">‹ ${isEdit?'프로젝트':'내 프로젝트'}</button>
<div class="card">
  <div style="font-size:16.5px;font-weight:700;margin-bottom:14px">${isEdit?'프로젝트 현황 수정':'새 프로젝트 등록'}</div>
  <div class="np-field"><label>프로젝트명 <span class="req">*</span></label>
    <input type="text" id="np-name" value="${esc(p.name||'')}" placeholder="예: 역삼동 업무시설 신축"></div>
  <div class="np-field"><label>건축주 <span class="req">*</span></label>
    <input type="text" id="np-client" value="${esc(p.client||'')}" placeholder="건축주명 또는 법인명"></div>
  <div class="np-field"><label>담당 PM</label>

  <div class="np-row">
    <div class="np-field"><label>진행 상태</label>
      <select id="np-status">${statuses.map(s=>`<option${(p.status||'진행중')===s?' selected':''}>${s}</option>`).join('')}</select></div>
    <div class="np-field"><label>현재 단계</label>
      <select id="np-phase">${PHASES.map(ph=>`<option${(p.phase||'기획')===ph?' selected':''}>${ph}</option>`).join('')}</select></div>
  </div>
  <div class="np-row">
    <div class="np-field"><label>용도</label>
      <select id="np-type">${types.map(t=>`<option${(p.type||'업무시설')===t?' selected':''}>${t}</option>`).join('')}</select></div>
    <div class="np-field"><label>사업비</label>

  </div>
  <div class="np-field"><label>주소</label>

  <div class="np-row">
    <div class="np-field"><label>계약일</label>
      <input type="date" id="np-contract" value="${p.contract||(isEdit?'':today())}"></div>
    <div class="np-field"><label>준공 목표</label>
      <input type="date" id="np-end" value="${p.end||''}"></div>
  </div>
  <div class="form-btns" style="margin-top:4px">
    <button class="add" onclick="saveProjForm()">${isEdit?'저장':'프로젝트 등록'}</button>
    <button class="cancel" onclick="${backClick}">취소</button>

</div>
<div class="np-note">면적·규모 등 상세 정보는<br>데스크톱 ArchPM의 프로젝트 편집에서 입력할 수 있습니다.</div>`;

// 계약일·준공 목표 변경 시 비율(phaseRatios)을 유지한 채 단계 마감일 재계산
// (데스크톱 recomputeDeadlines의 데이터 부분과 동일)
function recomputeDeadlinesData(p){
  if(!p.phaseRatios||!p.contract||!p.end) return;
  const start=new Date(p.contract);
  const totalDays=(new Date(p.end)-start)/86400000;
  if(totalDays<=0) return;
  if(!p.phaseDeadlines) p.phaseDeadlines={};
  let cum=0;
  PHASES.forEach(ph=>{
    const v=p.phaseRatios[ph]||0; cum+=v;
    if(v>0) p.phaseDeadlines[ph]=new Date(start.getTime()+(cum/100)*totalDays*86400000).toISOString().split('T')[0];
    else delete p.phaseDeadlines[ph];
  });
}

function saveProjForm(){
  const gv=id=>(document.getElementById(id)?.value||'').trim();
  const name=gv('np-name'), client=gv('np-client');
  if(!name){ alert('프로젝트명을 입력하세요. (필수)'); focusEl('np-name'); return; }
  if(!client){ alert('건축주를 입력하세요. (필수)'); focusEl('np-client'); return; }
  const fields={ name, client, pm:gv('np-pm'), status:gv('np-status'), phase:gv('np-phase'),
    type:gv('np-type'), budget:gv('np-budget'), addr:gv('np-addr'), contract:gv('np-contract'), end:gv('np-end') };
  if(V.screen==='edit'){
    const p=(D.projects||[]).find(x=>x.id===V.pid);
    if(!p){ alert('프로젝트를 찾을 수 없습니다.'); go('home'); return; }
    const datesChanged=p.contract!==fields.contract||p.end!==fields.end;
    Object.assign(p,fields);
    if(datesChanged) recomputeDeadlinesData(p);
    save();
    go('proj',V.pid);
  } else {
    if(!D.projects) D.projects=[];
    const id=uid();
    // 데스크톱 saveProject와 동일한 필드 구조로 저장
    D.projects.push({ id, created:today(), ...fields,
      design:'', permit:'', start:'', land:'', bldg:'', total:'', floors:'', desc:'' });
    // PM 미선택 상태에서 등록했다면 입력한 PM을 내 PM으로 기억
    if(fields.pm&&!localStorage.getItem(PM_KEY)) localStorage.setItem(PM_KEY,fields.pm);
    save();
    go('proj',id);   // 등록 직후 바로 업무 입력 화면으로
  }
}

function quickChips(inputId){
  return [['오늘',0],['내일',1],['+3일',3],['+7일',7]].map(([l,n])=>
    `<button class="chip" onclick="document.getElementById('${inputId}').value='${addDays(n)}'">${l}</button>`).join('');
}
function focusEl(id){ setTimeout(()=>{const el=document.getElementById(id);if(el)el.focus();},50); }

// ── 업무 CRUD (index.html과 동일한 데이터 구조) ──────────
function ensure(pid,phase){
  if(!D.phaseTasks) D.phaseTasks={};
  if(!D.phaseTasks[pid]) D.phaseTasks[pid]={};
  if(!D.phaseTasks[pid][phase]) D.phaseTasks[pid][phase]=[];
  return D.phaseTasks[pid][phase];
}
function addTask(pid,phase){
  const textEl=document.getElementById('tk-text');
  const dueEl=document.getElementById('tk-due');
  const text=(textEl?.value||'').trim();
  const due=dueEl?.value||'';
  if(!text){ textEl.focus(); return; }
  if(!due){ alert('마감일을 선택하세요. (필수)'); dueEl.focus(); return; }
  const now=new Date();
  ensure(pid,phase).push({id:uid(),text,done:false,dueDate:due,addedAt:`${now.getMonth()+1}/${now.getDate()}`});
  save(); render(); focusEl('tk-text');   // 연속 입력 편의: 폼 유지(V.addOpen 유지됨)
}
function addSub(pid,phase,taskId){
  const textEl=document.getElementById('sub-text-'+taskId);
  const text=(textEl?.value||'').trim();
  if(!text){ textEl.focus(); return; }
  const task=(D.phaseTasks?.[pid]?.[phase]||[]).find(t=>t.id===taskId);
  if(!task) return;
  if(!task.subTasks) task.subTasks=[];
  const now=new Date();
  // 마감일은 상위 업무에서만 관리 — 하위 업무는 내용만 등록
  task.subTasks.push({id:uid(),text,done:false,addedAt:`${now.getMonth()+1}/${now.getDate()}`});
  V.subOpen=null;
  save(); render();
}
function toggleTask(pid,phase,taskId){
  const t=(D.phaseTasks?.[pid]?.[phase]||[]).find(t=>t.id===taskId);
  if(t){ t.done=!t.done; save(); render(); }
}
function toggleSub(pid,phase,taskId,subId){
  const task=(D.phaseTasks?.[pid]?.[phase]||[]).find(t=>t.id===taskId);
  const sub=task?.subTasks?.find(s=>s.id===subId);
  if(!sub) return;
  sub.done=!sub.done;
  const allDone=task.subTasks.length>0&&task.subTasks.every(s=>s.done);
  if(allDone) task.done=true; else if(!sub.done) task.done=false;
  save(); render();
}
function delTask(pid,phase,taskId){
  if(!confirm('이 업무를 삭제할까요?')) return;
  D.phaseTasks[pid][phase]=(D.phaseTasks?.[pid]?.[phase]||[]).filter(t=>t.id!==taskId);
  save(); render();
}
function delSub(pid,phase,taskId,subId){
  const task=(D.phaseTasks?.[pid]?.[phase]||[]).find(t=>t.id===taskId);
  if(!task?.subTasks) return;
  task.subTasks=task.subTasks.filter(s=>s.id!==subId);
  save(); render();
}

initFirebase();
</script>
