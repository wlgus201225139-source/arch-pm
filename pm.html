<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e2330">
<title>ArchPM · PM 업무등록</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArchPM">
<style>
:root{--bg:#f4f5f7;--side:#1e2330;--pr:#3b82f6;--prd:#2563eb;--danger:#ef4444;--success:#10b981;--warn:#f59e0b;--tx:#1e293b;--muted:#64748b;--bd:#e2e8f0;--w:#fff;--r:10px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Segoe UI','Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
#app{display:none;flex-direction:column;min-height:100%}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:15px;color:var(--tx)}
input:focus,select:focus{outline:none;border-color:var(--pr)!important;box-shadow:0 0 0 3px rgba(59,130,246,.12)}

/* ── 로그인 ── */
#login-screen{position:fixed;inset:0;background:var(--side);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100}
.login-box{background:var(--w);border-radius:16px;padding:28px 24px;width:100%;max-width:360px}
.login-box h1{font-size:22px;font-weight:700;text-align:center;margin-bottom:4px}
.login-box .sub{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:22px}
.login-box input{width:100%;padding:13px 14px;border:1px solid var(--bd);border-radius:9px;margin-bottom:10px;font-size:15px}
.login-box .go{width:100%;padding:13px;background:var(--pr);color:#fff;border:none;border-radius:9px;font-size:15.5px;font-weight:600;margin-top:4px}
#login-err{font-size:12.5px;color:var(--danger);min-height:18px;margin-bottom:4px;text-align:center}
.login-note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6}

/* ── 헤더 ── */
#hdr{background:var(--side);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
#hdr .logo{font-size:16px;font-weight:700;letter-spacing:-.3px}
#hdr .pm-badge{font-size:11px;background:rgba(255,255,255,.12);padding:3px 9px;border-radius:100px;color:rgba(255,255,255,.85)}
#hdr .sp{flex:1}
#hdr button{background:none;border:none;color:rgba(255,255,255,.65);font-size:12px;padding:5px 8px}

/* ── 공통 ── */
#content{flex:1;padding:14px 14px 40px;max-width:640px;width:100%;margin:0 auto}
.card{background:var(--w);border-radius:var(--r);box-shadow:0 1px 3px rgba(0,0,0,.08);padding:15px;margin-bottom:11px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600;white-space:nowrap}
.b-bl{background:#dbeafe;color:#1d4ed8}.b-gr{background:#d1fae5;color:#065f46}
.b-ye{background:#fef3c7;color:#92400e}.b-re{background:#fee2e2;color:#991b1b}.b-gy{background:#f1f5f9;color:#475569}
.empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:13.5px}

/* ── 프로젝트 목록 ── */
.proj-card{display:block;width:100%;text-align:left;border:none;background:var(--w);border-radius:var(--r);box-shadow:0 1px 3px rgba(0,0,0,.08);padding:15px;margin-bottom:10px;border-left:4px solid var(--pr)}
.proj-card:active{background:#f8fafc}
.proj-card.p-done{border-left-color:var(--success);opacity:.7}
.proj-name{font-size:15.5px;font-weight:700;margin-bottom:5px}
.proj-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.sec-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:16px 2px 8px}

/* ── 단계 네비 ── */
.phase-nav{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.phase-chip{flex-shrink:0;border:1.5px solid var(--bd);background:var(--w);border-radius:100px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--muted)}
.phase-chip.cur{border-color:var(--pr);background:var(--pr);color:#fff}
.phase-chip.done{border-color:#bbf7d0;background:#f0fdf4;color:#059669}

/* ── 단계 섹션 ── */
.ph-sec{background:var(--w);border-radius:var(--r);box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:10px;overflow:hidden}
.ph-head{display:flex;align-items:center;gap:9px;padding:13px 15px;border:none;background:none;width:100%;text-align:left}
.ph-head .arrow{font-size:11px;color:var(--muted);transition:transform .15s}
.ph-head.open .arrow{transform:rotate(90deg)}
.ph-body{padding:0 15px 15px;border-top:1px solid var(--bd);padding-top:12px}
.ph-stat{font-size:12px;color:var(--muted)}

/* ── 업무 ── */
.task{border:1px solid var(--bd);border-radius:9px;margin-bottom:7px;background:#fff}
.task.done{background:var(--bg)}
.task-row{display:flex;align-items:flex-start;gap:10px;padding:11px 12px}
.task-row input[type=checkbox]{width:19px;height:19px;accent-color:var(--pr);flex-shrink:0;margin-top:1px}
.task-text{flex:1;font-size:14px;line-height:1.5;word-break:keep-all}
.task.done .task-text{text-decoration:line-through;color:var(--muted)}
.task-del{background:none;border:none;color:#cbd5e1;font-size:15px;padding:0 2px;line-height:1}
.subs{padding:0 12px 10px 40px}
.sub-row{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;background:#f8fafc;margin-bottom:4px;border:1px solid #e5e7eb}
.sub-row.done{background:#f0fdf4;border-color:#bbf7d0}
.sub-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--pr);flex-shrink:0}
.sub-text{flex:1;font-size:12.5px}
.sub-row.done .sub-text{text-decoration:line-through;color:var(--muted)}
.sub-add-btn{font-size:12px;color:var(--pr);background:none;border:none;padding:2px 0;opacity:.8}

/* ── 입력 폼 ── */
.add-form{margin-top:10px;padding:12px;background:#f8fafc;border-radius:9px;border:1px dashed #cbd5e1}
.add-form input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:8px;margin-bottom:9px;font-size:14.5px}
.due-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.due-label{font-size:12.5px;font-weight:700;color:var(--tx)}
.due-label .req{color:var(--danger)}
.due-row input[type=date]{padding:8px 10px;border:1px solid var(--bd);border-radius:8px;font-size:13.5px;background:#fff;flex:1;min-width:130px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--bd);background:#fff;border-radius:100px;padding:5px 12px;font-size:12px;color:var(--muted);font-weight:600}
.chip.on{border-color:var(--pr);background:#eff6ff;color:var(--pr)}
.form-btns{display:flex;gap:7px}
.form-btns .add{flex:1;padding:11px;background:var(--pr);color:#fff;border:none;border-radius:8px;font-size:14.5px;font-weight:600}
.form-btns .cancel{padding:11px 16px;background:#fff;color:var(--muted);border:1px solid var(--bd);border-radius:8px;font-size:13.5px}
.open-add{width:100%;padding:10px;background:transparent;border:1.5px dashed var(--pr);color:var(--pr);border-radius:9px;font-size:13.5px;font-weight:600;margin-top:9px;opacity:.85}

/* ── 토스트 ── */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(30,35,48,.94);color:#fff;padding:10px 20px;border-radius:100px;font-size:13px;transition:transform .25s;z-index:200;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0)}

.back-btn{background:none;border:none;color:var(--pr);font-size:14px;font-weight:600;padding:2px 0;margin-bottom:10px;display:inline-flex;align-items:center;gap:4px}
select.pm-sel{padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:#fff;width:100%}

/* ── 새 프로젝트 폼 ── */
.np-field{margin-bottom:12px}
.np-field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.np-field .req{color:var(--danger)}
.np-field input,.np-field select{width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:8px;font-size:14.5px;background:#fff}
.np-row{display:flex;gap:9px}
.np-row .np-field{flex:1}
.np-note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.6}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login-screen">
  <div class="login-box">
    <h1>⬡ ArchPM</h1>
    <div class="sub">PM 업무등록 · 모바일</div>
    <div id="login-err"></div>
    <input id="li-email" type="email" placeholder="이메일" autocomplete="email" onkeydown="if(event.key==='Enter')doLogin()">
    <input id="li-pw" type="password" placeholder="비밀번호" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="go" onclick="doLogin()">로그인</button>
    <div class="login-note">계정이 없거나 승인이 필요하면<br>데스크톱 ArchPM에서 회원가입 후 관리자 승인을 받으세요.</div>
  </div>
</div>

<!-- 앱 -->
<div id="app">
  <div id="hdr">
    <span class="logo">⬡ ArchPM</span>
    <span class="pm-badge" id="hdr-pm"></span>
    <span class="sp"></span>
    <button onclick="doLogout()">로그아웃</button>
  </div>
  <div id="content"></div>
</div>

<div id="toast">✓ 저장됨 — 웹에 반영되었습니다</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
// ============================================================
// ArchPM PM 모드 — index.html과 동일한 Firestore 문서(data/main)를
// 공유한다. 여기서 저장하면 데스크톱 웹앱에 실시간 반영된다.
// ============================================================
const FB_CONFIG = {
  apiKey: "AIzaSyCX22hL4YIhdf0AURbo5LFdqgZHLAf29k4",
  authDomain: "msarchi-757c8.firebaseapp.com",
  projectId: "msarchi-757c8",
  storageBucket: "msarchi-757c8.firebasestorage.app",
  messagingSenderId: "171658534163",
  appId: "1:171658534163:web:6fa4a05cce154ec91f8ee6",
  measurementId: "G-PPFL1JLJMT"
};
const PHASES = ['기획','계획설계','기본설계','중간설계','실시설계','허가'];
const PM_KEY = 'archpm_pm_name';

let D = null;            // 로드 전에는 null — 저장 금지 (빈 데이터로 덮어쓰기 방지)
let fbAuth=null, fbDb=null, _unsub=null, _saving=false, _userDoc=null;
// V: 화면 상태
let V = { screen:'home', pid:null, openPhase:null, showAll:false, addOpen:null, subOpen:null };

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function today(){ return new Date().toISOString().split('T')[0]; }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().split('T')[0]; }
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fdate(s){ if(!s)return '-'; const d=new Date(s); return `${d.getMonth()+1}/${d.getDate()}`; }

// ── 인증 ─────────────────────────────────────────────────
function initFirebase(){
  firebase.initializeApp(FB_CONFIG);
  fbAuth=firebase.auth(); fbDb=firebase.firestore();
  fbAuth.onAuthStateChanged(user=>{
    if(user){ checkApproval(user); }
    else{
      _userDoc=null; D=null;
      document.getElementById('login-screen').style.display='flex';
      document.getElementById('app').style.display='none';
      if(_unsub){_unsub();_unsub=null;}
    }
  });
}
function checkApproval(user){
  fbDb.collection('users').doc(user.uid).get().then(doc=>{
    if(doc.exists && doc.data().status==='approved'){ _userDoc=doc.data(); enterApp(); }
    else{
      showErr(doc.exists?'승인 대기 중입니다. 관리자에게 문의하세요.':'데스크톱 ArchPM에서 먼저 회원가입하세요.');
      fbAuth.signOut();
    }
  }).catch(()=>{ _userDoc={name:user.email.split('@')[0]}; enterApp(); });
}
function doLogin(){
  const email=(document.getElementById('li-email').value||'').trim();
  const pw=document.getElementById('li-pw').value||'';
  if(!email||!pw){ showErr('이메일과 비밀번호를 입력하세요.'); return; }
  showErr('');
  fbAuth.signInWithEmailAndPassword(email,pw).catch(e=>{
    const m={'auth/user-not-found':'등록되지 않은 이메일입니다.','auth/wrong-password':'비밀번호가 틀렸습니다.','auth/invalid-email':'이메일 형식이 올바르지 않습니다.','auth/too-many-requests':'시도가 너무 많습니다. 잠시 후 다시.','auth/invalid-credential':'이메일 또는 비밀번호가 올바르지 않습니다.'};
    showErr(m[e.code]||'로그인 실패: '+e.message);
  });
}
function doLogout(){ if(fbAuth) fbAuth.signOut(); }
function showErr(m){ document.getElementById('login-err').textContent=m; }

// ── 데이터 로드/저장 ─────────────────────────────────────
function enterApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('content').innerHTML='<div class="empty">불러오는 중...</div>';
  fbDb.collection('data').doc('main').get().then(doc=>{
    if(doc.exists){ D=doc.data(); if(!D.phaseTasks) D.phaseTasks={}; render(); setupSync(); }
    else{ document.getElementById('content').innerHTML='<div class="empty">데이터가 없습니다.<br>데스크톱 ArchPM에서 먼저 프로젝트를 등록하세요.</div>'; }
  }).catch(e=>{
    document.getElementById('content').innerHTML='<div class="empty">데이터를 불러오지 못했습니다.<br>'+esc(e.message)+'</div>';
  });
}
function setupSync(){
  if(_unsub)_unsub();
  _unsub=fbDb.collection('data').doc('main').onSnapshot(snap=>{
    if(!snap.exists||_saving) return;
    if(snap.metadata.hasPendingWrites) return;
    D=snap.data(); if(!D.phaseTasks) D.phaseTasks={};
    render();
  },e=>console.warn('sync error:',e));
}
function save(){
  if(!D){ alert('데이터가 아직 로드되지 않았습니다.'); return; }
  _saving=true;
  fbDb.collection('data').doc('main').set(D)
    .then(()=>{ _saving=false; toast(); })
    .catch(e=>{ _saving=false; alert('저장 실패: '+e.message); });
}
function toast(){
  const t=document.getElementById('toast');
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800);
}

// ── PM 매칭 ──────────────────────────────────────────────
function pmNames(){
  const s=new Set();
  (D.projects||[]).forEach(p=>{ if(p.pm&&p.pm.trim()) s.add(p.pm.trim()); });
  return [...s].sort();
}
function myPm(){
  const saved=localStorage.getItem(PM_KEY);
  if(saved) return saved;
  const names=pmNames();
  const uname=(_userDoc?.name||'').trim();
  if(uname&&names.includes(uname)) return uname;
  return '';
}
function setPm(name){
  if(name) localStorage.setItem(PM_KEY,name); else localStorage.removeItem(PM_KEY);
  render();
}

// ── 렌더 ─────────────────────────────────────────────────
function go(screen,pid){ V={...V,screen,pid:pid||null,openPhase:null,addOpen:null,subOpen:null}; render(); window.scrollTo(0,0); }
function render(){
  if(!D) return;
  document.getElementById('hdr-pm').textContent=myPm()?('PM · '+myPm()):'PM 미선택';
  const c=document.getElementById('content');
  c.innerHTML = V.screen==='proj'&&V.pid ? renderProj(V.pid) : V.screen==='new' ? renderNewProj() : renderHome();
}

function taskCount(pid){
  let total=0,done=0,soon=null;
  const t=today();
  PHASES.forEach(ph=>(D.phaseTasks?.[pid]?.[ph]||[]).forEach(tk=>{
    total++; if(tk.done) done++;
    const dues=[tk.dueDate,...(tk.subTasks||[]).filter(s=>!s.done).map(s=>s.dueDate)].filter(Boolean);
    dues.forEach(d=>{ if(!tk.done&&(soon===null||d<soon)) soon=d; });
  }));
  return {total,done,soon};
}

function renderHome(){
  const pm=myPm();
  const names=pmNames();
  const pmSel=`
<div class="card">
  <div style="font-size:12.5px;font-weight:700;margin-bottom:7px">담당 PM 선택</div>
  <select class="pm-sel" onchange="setPm(this.value)">
    <option value="">— PM을 선택하세요 —</option>
    ${names.map(n=>`<option value="${esc(n)}" ${n===pm?'selected':''}>${esc(n)}</option>`).join('')}
  </select>
</div>`;
  if(!pm) return pmSel+`<div class="empty">담당 PM을 선택하면<br>내 프로젝트가 표시됩니다.</div>`;

  const mine=(D.projects||[]).filter(p=>(p.pm||'').trim()===pm);
  const others=(D.projects||[]).filter(p=>(p.pm||'').trim()!==pm);
  const ORDER={'진행중':0,'대기':1,'보류':2,'완료':3};
  mine.sort((a,b)=>(ORDER[a.status]??9)-(ORDER[b.status]??9));

  const projCard=p=>{
    const {total,done,soon}=taskCount(p.id);
    const t=today();
    const soonBadge=soon?(soon<t?`<span class="badge b-re">마감 초과 ${fdate(soon)}</span>`:soon===t?`<span class="badge b-bl">오늘 마감</span>`:`<span class="badge b-ye">다음 마감 ${fdate(soon)}</span>`):'';
    return `
<button class="proj-card ${p.status==='완료'?'p-done':''}" onclick="go('proj','${p.id}')">
  <div class="proj-name">${esc(p.name)}</div>
  <div class="proj-meta">
    <span class="badge b-bl">${esc(p.phase||'-')}</span>
    <span class="badge ${p.status==='진행중'?'b-gr':'b-gy'}">${esc(p.status||'-')}</span>
    <span>업무 ${done}/${total}</span>
    ${soonBadge}
  </div>
</button>`;
  };

  return pmSel
    +`<div class="sec-title">내 프로젝트 (${mine.length})</div>`
    +(mine.length?mine.map(projCard).join(''):`<div class="empty">'${esc(pm)}' 담당 프로젝트가 없습니다.</div>`)
    +`<button class="open-add" onclick="go('new')">＋ 새 프로젝트 등록</button>`
    +(others.length?`
<button class="open-add" style="margin-top:14px" onclick="V.showAll=!V.showAll;render()">${V.showAll?'다른 PM 프로젝트 숨기기':'다른 PM 프로젝트 보기 ('+others.length+')'}</button>
${V.showAll?others.map(projCard).join(''):''}`:'');
}

// ── 프로젝트 화면 ────────────────────────────────────────
function dueBadge(due,small){
  if(!due) return '';
  const t=today(), tm=addDays(1);
  let label,bg,color;
  if(due<t){const d=Math.round((new Date(t)-new Date(due))/864e5);label=`${d}일 초과`;bg='#fee2e2';color='#b91c1c';}
  else if(due===t){label='오늘';bg='#dbeafe';color='#1d4ed8';}
  else if(due===tm){label='내일';bg='#fef3c7';color='#92400e';}
  else{const d=Math.round((new Date(due)-new Date(t))/864e5);label=`${d}일 후`;bg='#f0fdf4';color='#15803d';}
  return `<span style="font-size:${small?'10px':'11px'};padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap;background:${bg};color:${color};flex-shrink:0">${label}</span>`;
}

function renderProj(pid){
  const p=(D.projects||[]).find(x=>x.id===pid);
  if(!p) return '<div class="empty">프로젝트를 찾을 수 없습니다.</div>';
  const curPhase=p.phase&&PHASES.includes(p.phase)?p.phase:PHASES[0];
  const open=V.openPhase||curPhase;
  const curIdx=PHASES.indexOf(curPhase);

  const chips=PHASES.map((ph,i)=>{
    const cls=ph===open?'cur':(i<curIdx?'done':'');
    return `<button class="phase-chip ${cls}" onclick="V.openPhase='${ph}';V.addOpen=null;V.subOpen=null;render()">${ph}</button>`;
  }).join('');

  return `
<button class="back-btn" onclick="go('home')">‹ 내 프로젝트</button>
<div class="card">
  <div class="proj-name" style="font-size:17px">${esc(p.name)}</div>
  <div class="proj-meta">
    <span class="badge b-bl">${esc(curPhase)}</span>
    <span class="badge ${p.status==='진행중'?'b-gr':'b-gy'}">${esc(p.status||'-')}</span>
    ${p.client?`<span>🏢 ${esc(p.client)}</span>`:''}
  </div>
</div>
<div class="phase-nav">${chips}</div>
${renderPhaseSec(pid,open,true)}
<div class="sec-title">다른 단계</div>
${PHASES.filter(ph=>ph!==open).map(ph=>renderPhaseSec(pid,ph,false)).join('')}`;
}

function renderPhaseSec(pid,phase,expanded){
  const tasks=D.phaseTasks?.[pid]?.[phase]||[];
  const done=tasks.filter(t=>t.done).length;
  const isOpen=expanded;
  const head=`
<button class="ph-head ${isOpen?'open':''}" onclick="V.openPhase='${phase}';V.addOpen=null;V.subOpen=null;render()">
  <span class="arrow">▶</span>
  <span style="font-weight:700;font-size:14.5px">${phase}</span>
  <span class="ph-stat">${tasks.length?`${done}/${tasks.length} 완료`:'업무 없음'}</span>
</button>`;
  if(!isOpen) return `<div class="ph-sec">${head}</div>`;

  const rows=tasks.map(t=>{
    const subs=t.subTasks||[];
    const subOpen=V.subOpen===t.id;
    return `
<div class="task ${t.done?'done':''}">
  <div class="task-row">
    <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${pid}','${phase}','${t.id}')">
    <span class="task-text">${esc(t.text)}</span>
    ${dueBadge(t.dueDate)}
    <button class="task-del" onclick="delTask('${pid}','${phase}','${t.id}')">✕</button>
  </div>
  ${subs.length?`<div class="subs">${subs.map(s=>`
    <div class="sub-row ${s.done?'done':''}">
      <input type="checkbox" ${s.done?'checked':''} onchange="toggleSub('${pid}','${phase}','${t.id}','${s.id}')">
      <span class="sub-text">${esc(s.text)}</span>
      ${dueBadge(s.dueDate,true)}
      <button class="task-del" style="font-size:12px" onclick="delSub('${pid}','${phase}','${t.id}','${s.id}')">✕</button>
    </div>`).join('')}</div>`:''}
  <div style="padding:0 12px 9px 40px">
    ${subOpen?`
    <div class="add-form" style="margin-top:2px;padding:10px">
      <input type="text" id="sub-text-${t.id}" placeholder="하위 업무 내용" onkeydown="if(event.key==='Enter')addSub('${pid}','${phase}','${t.id}')">
      <div class="form-btns">
        <button class="add" onclick="addSub('${pid}','${phase}','${t.id}')">하위 업무 추가</button>
        <button class="cancel" onclick="V.subOpen=null;render()">취소</button>
      </div>
    </div>`
    :`<button class="sub-add-btn" onclick="V.subOpen='${t.id}';V.addOpen=null;render();focusEl('sub-text-${t.id}')">＋ 하위 업무</button>`}
  </div>
</div>`;
  }).join('');

  const addOpen=V.addOpen===phase;
  const addForm=addOpen?`
<div class="add-form">
  <input type="text" id="tk-text" placeholder="업무 내용을 입력하세요" onkeydown="if(event.key==='Enter')addTask('${pid}','${phase}')">
  <div class="due-row">
    <span class="due-label">마감일 <span class="req">*</span></span>
    <input type="date" id="tk-due" value="${today()}" min="2020-01-01">
  </div>
  <div class="chips">${quickChips('tk-due')}</div>
  <div class="form-btns">
    <button class="add" onclick="addTask('${pid}','${phase}')">업무 추가</button>
    <button class="cancel" onclick="V.addOpen=null;render()">취소</button>
  </div>
</div>`
  :`<button class="open-add" onclick="V.addOpen='${phase}';V.subOpen=null;render();focusEl('tk-text')">＋ 업무 추가</button>`;

  return `<div class="ph-sec">${head}<div class="ph-body">
    ${rows||'<div style="font-size:13px;color:var(--muted);padding:2px 0 4px">등록된 업무가 없습니다.</div>'}
    ${addForm}
  </div></div>`;
}

// ── 새 프로젝트 등록 ─────────────────────────────────────
function renderNewProj(){
  const types=['업무시설','근린생활시설','단독주택','공동주택','교육시설','의료시설','기타'];
  return `
<button class="back-btn" onclick="go('home')">‹ 내 프로젝트</button>
<div class="card">
  <div style="font-size:16.5px;font-weight:700;margin-bottom:14px">새 프로젝트 등록</div>
  <div class="np-field"><label>프로젝트명 <span class="req">*</span></label>
    <input type="text" id="np-name" placeholder="예: 역삼동 업무시설 신축"></div>
  <div class="np-field"><label>건축주 <span class="req">*</span></label>
    <input type="text" id="np-client" placeholder="건축주명 또는 법인명"></div>
  <div class="np-field"><label>담당 PM</label>
    <input type="text" id="np-pm" value="${esc(myPm())}" placeholder="담당자 이름"></div>
  <div class="np-row">
    <div class="np-field"><label>용도</label>
      <select id="np-type">${types.map(t=>`<option>${t}</option>`).join('')}</select></div>
    <div class="np-field"><label>현재 단계</label>
      <select id="np-phase">${PHASES.map(ph=>`<option>${ph}</option>`).join('')}</select></div>
  </div>
  <div class="np-field"><label>주소</label>
    <input type="text" id="np-addr" placeholder="대지 주소"></div>
  <div class="np-row">
    <div class="np-field"><label>계약일</label>
      <input type="date" id="np-contract" value="${today()}"></div>
    <div class="np-field"><label>준공 목표</label>
      <input type="date" id="np-end"></div>
  </div>
  <div class="form-btns" style="margin-top:4px">
    <button class="add" onclick="addProject()">프로젝트 등록</button>
    <button class="cancel" onclick="go('home')">취소</button>
  </div>
</div>
<div class="np-note">사업비·면적·규모 등 상세 정보는<br>데스크톱 ArchPM의 프로젝트 편집에서 입력할 수 있습니다.</div>`;
}
function addProject(){
  const gv=id=>(document.getElementById(id)?.value||'').trim();
  const name=gv('np-name'), client=gv('np-client');
  if(!name){ alert('프로젝트명을 입력하세요. (필수)'); focusEl('np-name'); return; }
  if(!client){ alert('건축주를 입력하세요. (필수)'); focusEl('np-client'); return; }
  if(!D.projects) D.projects=[];
  const id=uid();
  // 데스크톱 saveProject와 동일한 필드 구조로 저장
  D.projects.push({
    id, created:today(), name, client, pm:gv('np-pm'), type:gv('np-type'),
    status:'진행중', phase:gv('np-phase'), addr:gv('np-addr'), budget:'',
    contract:gv('np-contract'), design:'', permit:'', start:'', end:gv('np-end'),
    land:'', bldg:'', total:'', floors:'', desc:''
  });
  // PM 미선택 상태에서 등록했다면 입력한 PM을 내 PM으로 기억
  if(gv('np-pm')&&!localStorage.getItem(PM_KEY)) localStorage.setItem(PM_KEY,gv('np-pm'));
  save();
  go('proj',id);   // 등록 직후 바로 업무 입력 화면으로
}

function quickChips(inputId){
  return [['오늘',0],['내일',1],['+3일',3],['+7일',7]].map(([l,n])=>
    `<button class="chip" onclick="document.getElementById('${inputId}').value='${addDays(n)}'">${l}</button>`).join('');
}
function focusEl(id){ setTimeout(()=>{const el=document.getElementById(id);if(el)el.focus();},50); }

// ── 업무 CRUD (index.html과 동일한 데이터 구조) ──────────
function ensure(pid,phase){
  if(!D.phaseTasks) D.phaseTasks={};
  if(!D.phaseTasks[pid]) D.phaseTasks[pid]={};
  if(!D.phaseTasks[pid][phase]) D.phaseTasks[pid][phase]=[];
  return D.phaseTasks[pid][phase];
}
function addTask(pid,phase){
  const textEl=document.getElementById('tk-text');
  const dueEl=document.getElementById('tk-due');
  const text=(textEl?.value||'').trim();
  const due=dueEl?.value||'';
  if(!text){ textEl.focus(); return; }
  if(!due){ alert('마감일을 선택하세요. (필수)'); dueEl.focus(); return; }
  const now=new Date();
  ensure(pid,phase).push({id:uid(),text,done:false,dueDate:due,addedAt:`${now.getMonth()+1}/${now.getDate()}`});
  save(); render(); focusEl('tk-text');   // 연속 입력 편의: 폼 유지(V.addOpen 유지됨)
}
function addSub(pid,phase,taskId){
  const textEl=document.getElementById('sub-text-'+taskId);
  const text=(textEl?.value||'').trim();
  if(!text){ textEl.focus(); return; }
  const task=(D.phaseTasks?.[pid]?.[phase]||[]).find(t=>t.id===taskId);
  if(!task) return;
  if(!task.subTasks) task.subTasks=[];
  const now=new Date();
  // 마감일은 상위 업무에서만 관리 — 하위 업무는 내용만 등록
  task.subTasks.push({id:uid(),text,done:false,addedAt:`${now.getMonth()+1}/${now.getDate()}`});
  V.subOpen=null;
  save(); render();
}
function toggleTask(pid,phase,taskId){
  const t=(D.phaseTasks?.[pid]?.[phase]||[]).find(t=>t.id===taskId);
  if(t){ t.done=!t.done; save(); render(); }
}
function toggleSub(pid,phase,taskId,subId){
  const task=(D.phaseTasks?.[pid]?.[phase]||[]).find(t=>t.id===taskId);
  const sub=task?.subTasks?.find(s=>s.id===subId);
  if(!sub) return;
  sub.done=!sub.done;
  const allDone=task.subTasks.length>0&&task.subTasks.every(s=>s.done);
  if(allDone) task.done=true; else if(!sub.done) task.done=false;
  save(); render();
}
function delTask(pid,phase,taskId){
  if(!confirm('이 업무를 삭제할까요?')) return;
  D.phaseTasks[pid][phase]=(D.phaseTasks?.[pid]?.[phase]||[]).filter(t=>t.id!==taskId);
  save(); render();
}
function delSub(pid,phase,taskId,subId){
  const task=(D.phaseTasks?.[pid]?.[phase]||[]).find(t=>t.id===taskId);
  if(!task?.subTasks) return;
  task.subTasks=task.subTasks.filter(s=>s.id!==subId);
  save(); render();
}

initFirebase();
</script>
